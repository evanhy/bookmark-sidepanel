name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          zip -r quick-bookmarks-${{ github.ref_name }}.zip . -x "*.git*" -x ".github/*" -x "*.DS_Store"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: quick-bookmarks-${{ github.ref_name }}.zip
          generate_release_notes: true
