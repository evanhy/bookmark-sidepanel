<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书签</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="pmb-app" class="pmb-app">
    <!-- 级联多列面板容器 (Popup my Bookmarks 模式) -->
    <div id="pmb-panels-container" class="pmb-panels-container">
      <div class="loading-state"><div class="spinner"></div><p>正在加载书签...</p></div>
    </div>

    <!-- 树状折叠备用容器 -->
    <div id="pmb-tree-container" class="pmb-tree-container hidden">
      <div class="pmb-header root-header">
        <span class="header-title">书签栏</span>
        <div class="header-tools">
          <button id="btn-tree-expand" class="h-btn" title="全部展开">展开</button>
          <button id="btn-tree-collapse" class="h-btn" title="全部折叠">折叠</button>
          <button id="btn-switch-to-cascade" class="h-btn" title="切换到级联面板模式">级联模式</button>
          <button id="btn-tree-manager" class="h-btn" title="书签管理器">⚙</button>
        </div>
      </div>
      <div class="search-box-wrap">
        <input type="text" id="tree-search-input" class="search-input" placeholder="快速搜索书签..." autocomplete="off" />
        <button id="clear-tree-search" class="clear-btn hidden">✕</button>
      </div>
      <div id="tree-list" class="tree-list"></div>
    </div>
  </div>

  <!-- 书签项右键菜单 -->
  <div id="bookmark-context-menu" class="context-menu hidden">
    <div class="menu-item" data-action="open-current">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      <span>在当前标签页打开</span>
    </div>
    <div class="menu-item" data-action="open-new-tab">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      <span>在新标签页打开</span>
    </div>
    <div class="menu-item" data-action="open-bg-tab">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
      <span>在后台标签页打开</span>
    </div>
    <div class="menu-item" data-action="open-incognito">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span>在无痕窗口中打开</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="copy-url">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      <span>复制链接地址</span>
    </div>
    <div class="menu-item" data-action="edit-bookmark">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span>编辑书签...</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item delete" data-action="delete-bookmark">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>删除书签</span>
    </div>
  </div>

  <!-- 文件夹右键菜单 -->
  <div id="folder-context-menu" class="context-menu hidden">
    <div class="menu-item" data-action="open-all-tabs">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      <span>打开全部书签</span>
    </div>
    <div class="menu-item" data-action="open-all-window">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
      <span>在新窗口中全部打开</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="new-folder">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>
      <span>新建子文件夹...</span>
    </div>
    <div class="menu-item" data-action="rename-folder">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span>重命名文件夹...</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item delete" data-action="delete-folder">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>删除文件夹</span>
    </div>
  </div>

  <!-- 编辑模态对话框 -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <h3 id="modal-title" class="modal-title">编辑书签</h3>
      <div class="modal-form">
        <label for="modal-input-title">名称</label>
        <input type="text" id="modal-input-title" class="modal-input" placeholder="输入名称" />
        <div id="modal-url-group">
          <label for="modal-input-url">网址 (URL)</label>
          <input type="text" id="modal-input-url" class="modal-input" placeholder="https://..." />
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn btn-secondary">取消</button>
        <button id="btn-modal-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
